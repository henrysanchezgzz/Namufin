<style>html{background:#05061a}</style>
<style>
:root{--bg:#05061a;--card:rgba(14,16,48,.72);--fill:rgba(255,255,255,.08);--fill-2:rgba(255,255,255,.14);--line:rgba(255,255,255,.08);
  --ink:#fff;--ink-2:rgba(255,255,255,.62);--muted:rgba(255,255,255,.4);--accent:#4ade80;--red:#ff5a4e;--coral:#ff7a6b;--amber:#ffc53d;--blue:#4c7dff;
  --sheet:#12143a;--tab:rgba(22,24,60,.62);--pri:#fff;--pri-ink:#000;--ease:cubic-bezier(.2,.8,.2,1)}
body.v-ahorro{--card:rgba(4,40,46,.72);--sheet:#0a2a31;--tab:rgba(6,40,46,.62)}
body.v-movs,body.v-reportes{--card:#16161b;--sheet:#1c1c22;--tab:rgba(28,28,34,.7)}
body.light{--bg:#eef0f7;--card:rgba(255,255,255,.9);--fill:rgba(11,16,48,.06);--fill-2:rgba(11,16,48,.09);--line:rgba(11,16,48,.08);
  --ink:#0b1030;--ink-2:rgba(11,16,48,.6);--muted:rgba(11,16,48,.4);--accent:#16a34a;--red:#e5372b;--coral:#e8553f;--amber:#b77400;--blue:#2f5bff;
  --sheet:#fff;--tab:rgba(255,255,255,.8);--pri:#0b1030;--pri-ink:#fff}
body.light.v-ahorro,body.light.v-movs,body.light.v-reportes{--card:#fff;--sheet:#fff}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;overscroll-behavior:none;touch-action:manipulation;-webkit-text-size-adjust:100%;text-size-adjust:100%;background:var(--bg);-webkit-user-select:none;user-select:none}
input,textarea{-webkit-user-select:text;user-select:text}
body{font-family:Inter,-apple-system,BlinkMacSystemFont,system-ui,sans-serif;color:var(--ink);font-size:15px;line-height:1.4;min-height:100vh;overflow-x:hidden;-webkit-font-smoothing:antialiased;letter-spacing:-.01em;transition:color .3s}
button,input,textarea{font:inherit;color:inherit;letter-spacing:inherit}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.hidden{display:none!important}

/* fondos */
.bgs{position:fixed;inset:0;z-index:0;pointer-events:none}
.bg-inicio{background:radial-gradient(120% 60% at 50% 0%,#2433ff 0%,#1a1fd6 28%,#10128a 52%,#070833 78%,#05061a 100%)}
.bg-ahorro{background:radial-gradient(120% 60% at 50% 0%,#14c2ab 0%,#0f8f86 28%,#0a4f57 55%,#06232e 80%,#04121a 100%)}
.bg-dark{background:radial-gradient(120% 50% at 50% 0%,#1d1d26 0%,#0b0b10 55%,#000 100%)}
body.light .bg-inicio{background:radial-gradient(120% 55% at 50% 0%,#b9c2ff 0%,#d6dbff 35%,#eef0f7 75%)}
body.light .bg-ahorro{background:radial-gradient(120% 55% at 50% 0%,#a9ece0 0%,#d3f4ee 35%,#eef0f7 75%)}
body.light .bg-dark{background:#f2f3f7}

.app{position:relative;z-index:1;max-width:560px;margin:0 auto;padding:0 18px calc(110px + env(safe-area-inset-bottom))}
@media (min-width:900px){.app{max-width:980px}.cols{display:grid;grid-template-columns:1fr 1fr;gap:20px;align-items:start}}

/* barra superior */
.topbar{position:fixed;z-index:40;display:flex;align-items:center;gap:10px}

.avatar{width:40px;height:40px;border-radius:50%;border:0;padding:0;overflow:hidden;cursor:pointer;flex:none;background:transparent;box-shadow:0 0 0 1px var(--line)}
.avatar img{width:100%;height:100%;display:block}
.month{flex:1;display:flex;align-items:center;justify-content:space-between;height:42px;border-radius:99px;background:var(--fill-2);padding:0 4px}
.month span{font-size:15px;font-weight:600;text-align:center;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.month button,.rbtn{border:0;background:transparent;color:var(--ink);display:grid;place-items:center;cursor:pointer;border-radius:50%;width:34px;height:34px;transition:transform .15s}
.rbtn{width:42px;height:42px;background:var(--fill-2);flex:none}
.rbtn:active,.month button:active{transform:scale(.9)}

/* saldo */
.hero{text-align:center;padding:30px 0 24px}
.hero .lbl{color:var(--ink-2);font-size:14px;font-weight:500}
.hero .big{font-size:50px;font-weight:700;letter-spacing:-.04em;margin:6px 0 14px;font-variant-numeric:tabular-nums;line-height:1.05}
.big small{font-size:.5em;letter-spacing:-.02em;vertical-align:.62em;margin-left:1px}
.pill{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 16px;border-radius:99px;background:var(--fill-2);font-size:13.5px;font-weight:600;border:0;cursor:pointer}
.pill b{font-weight:700}

/* tarjetas y filas */
.card{background:var(--card);border-radius:22px;padding:16px;margin-bottom:12px;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
body.light .card{box-shadow:0 1px 2px rgba(11,16,48,.04),0 6px 20px -12px rgba(11,16,48,.18)}
.card h3{margin:0 0 6px;font-size:17px;font-weight:700;display:flex;align-items:center;justify-content:space-between;gap:8px;letter-spacing:-.02em}
.card h3 small{font-size:13px;color:var(--ink-2);font-weight:500}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}
.tile{background:var(--card);border-radius:20px;padding:14px 16px}
body.light .tile{box-shadow:0 6px 20px -12px rgba(11,16,48,.18)}
.tile small{color:var(--ink-2);font-size:12.5px;font-weight:500;display:block}
.tile b{display:block;font-size:19px;font-weight:700;margin-top:2px;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.anim{animation:up .5s var(--ease) both}
@keyframes up{from{opacity:0;transform:translateY(12px)}}

.row{display:flex;align-items:center;gap:12px;padding:11px 0;position:relative;cursor:pointer;transition:opacity .2s}
.row+.row::before{content:"";position:absolute;left:52px;right:0;top:0;height:1px;background:var(--line)}
.row:active{opacity:.6}
.ico{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;flex:none;color:var(--c);background:color-mix(in srgb,var(--c) 18%,transparent)}
.ico svg{width:19px;height:19px}
.ico .ini{font-weight:700;font-size:15px}
.info{flex:1;min-width:0}
.info b{display:block;font-weight:600;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.info small{display:block;color:var(--ink-2);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rt{text-align:right;flex:none;font-variant-numeric:tabular-nums}
.rt b{display:block;font-weight:600}
.rt small{color:var(--ink-2);font-size:12.5px}
.in{color:var(--accent)!important}
.rep{display:inline-flex;vertical-align:-2px;color:var(--accent);margin-right:3px}.rep svg{width:12px;height:12px}
.bar{height:4px;border-radius:99px;background:var(--fill-2);margin-top:7px;overflow:hidden}
.bar span{display:block;height:100%;width:0;border-radius:99px;background:var(--c,var(--accent));transition:width 1s var(--ease)}
.warn{color:var(--amber)!important} .over{color:var(--red)!important}
.foot{display:block;width:100%;text-align:center;padding:12px 0 2px;font-weight:600;font-size:15px;border:0;background:none;cursor:pointer;border-top:1px solid var(--line);margin-top:4px}
.empty{text-align:center;color:var(--ink-2);padding:20px 10px;font-size:14px}
.insight{display:flex;align-items:center;gap:12px;cursor:pointer}
.insight .info small{white-space:normal}
.insight .info b{white-space:normal}
.chev{color:var(--muted)} .chev svg{width:18px;height:18px}

/* barra inferior */
.tabbar{position:fixed;z-index:50;left:14px;right:14px;bottom:calc(10px + env(safe-area-inset-bottom));display:grid;grid-template-columns:repeat(5,1fr);align-items:center;padding:6px;border-radius:30px;
  background:var(--tab);border:1px solid var(--line);backdrop-filter:blur(24px) saturate(1.6);-webkit-backdrop-filter:blur(24px) saturate(1.6);transition:background .5s}
.tabbar a{display:flex;flex-direction:column;align-items:center;gap:2px;text-decoration:none;color:var(--muted);font-size:10.5px;font-weight:600;padding:4px 0 3px;transition:color .3s;min-width:0}
.tabbar a span:last-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.tabbar .tic{display:grid;place-items:center;padding:4px 16px;border-radius:99px;transition:background .3s var(--ease)}
.tabbar a svg{width:21px;height:21px}
.tabbar a.on{color:var(--ink)}
.tabbar a.on .tic{background:var(--fill-2)}
.tab-add{justify-self:center;width:46px;height:46px;border-radius:50%;border:0;background:var(--pri);color:var(--pri-ink);display:grid;place-items:center;cursor:pointer;transition:transform .2s var(--ease)}
.tab-add svg{width:24px;height:24px;stroke-width:2.6}
.tab-add:active{transform:scale(.9)}
@media (min-width:700px){.tabbar{left:50%;right:auto;transform:translateX(-50%);width:440px}}

/* títulos de página */
.ptitle{font-size:32px;font-weight:800;letter-spacing:-.035em;margin:6px 0 14px}
.sec{font-weight:700;font-size:19px;margin:22px 2px 10px;letter-spacing:-.02em;display:flex;justify-content:space-between;align-items:center}

/* movimientos */
.search{display:flex;align-items:center;gap:8px;height:42px;border-radius:12px;background:var(--fill);padding:0 6px 0 12px;margin-bottom:10px;color:var(--ink-2)}
.search input{flex:1;background:transparent;border:0;outline:0;color:var(--ink);font-size:16px;min-width:0}
.search input::placeholder{color:var(--muted)}
.search button{border:0;background:transparent;color:var(--ink-2);width:34px;height:34px;border-radius:9px;display:grid;place-items:center;cursor:pointer}
.search button.on{background:var(--fill-2);color:var(--ink)}
.chips{display:flex;gap:6px;overflow-x:auto;margin:0 -18px 12px;padding:0 18px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:0;background:var(--fill);color:var(--ink-2);font-weight:600;font-size:13.5px;padding:8px 14px;border-radius:99px;cursor:pointer;transition:background .25s,color .25s;display:inline-flex;align-items:center;gap:6px}
.chip.on{background:var(--pri);color:var(--pri-ink)}
.dayh{display:flex;justify-content:space-between;align-items:baseline;margin:16px 2px 8px;font-weight:700;font-size:16px}
.dayh span{font-size:13.5px;color:var(--ink-2);font-weight:600;font-variant-numeric:tabular-nums}
.swr{position:relative;overflow:hidden}
.swr+.swr::before{content:"";position:absolute;left:52px;right:0;top:0;height:1px;background:var(--line);z-index:2}
.swr .del{position:absolute;right:0;top:8px;bottom:8px;width:76px;border:0;background:var(--red);color:#fff;font-weight:600;font-size:13px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;cursor:pointer;border-radius:14px}
.swr .row{background:var(--card);transition:transform .25s var(--ease);z-index:1}
.swr .del{opacity:0;transition:opacity .2s}.swr.swiping .del{opacity:1}
.swr .row+.row::before{display:none}

/* ahorro */
.ring{position:relative;width:min(74vw,290px);aspect-ratio:1;margin:14px auto 22px}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:9}
.ring .bg{stroke:var(--fill-2)}
.ring .fg{stroke:var(--ink);stroke-linecap:round;transition:stroke-dashoffset 1.4s var(--ease)}
.ring .c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.ring .c small{font-size:14px;color:var(--ink-2);font-weight:500}
.ring .c .big{font-size:42px;font-weight:700;letter-spacing:-.04em;margin:4px 0 6px;font-variant-numeric:tabular-nums}
.ring .c span{font-size:13px;color:var(--ink-2)}
.addrow{display:flex;align-items:center;gap:12px;padding:12px 0 4px;border-top:1px solid var(--line);margin-top:2px;font-weight:600;cursor:pointer;color:var(--ink)}
.addrow .ico{--c:var(--ink)}
.dots52{display:grid;grid-template-columns:repeat(13,1fr);gap:5px;margin:4px 0 16px}
.dots52 i{aspect-ratio:1;border-radius:50%;background:var(--fill-2)}
.dots52 i.on{background:var(--accent)}

/* reportes */
.k{font-size:13.5px;color:var(--ink-2);font-weight:500}
.vv{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.vv b{font-size:28px;font-weight:700;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}
.duo .card{margin:0;padding:14px}
.duo .vv b{font-size:21px}
.delta{font-size:13px;font-weight:600}
.up{color:var(--red)} .dn{color:var(--accent)}
.ax{display:flex;justify-content:space-between;font-size:11.5px;color:var(--muted);margin-top:4px;font-variant-numeric:tabular-nums}
.sp{width:100%;height:120px;display:block;margin-top:8px;overflow:visible}
.prev{fill:none;stroke:var(--muted);stroke-width:1.6;stroke-dasharray:3 4}
.draw{fill:none;stroke-width:2.2;stroke-linejoin:round;stroke-linecap:round;stroke-dasharray:1000;stroke-dashoffset:1000;transition:stroke-dashoffset 1.4s var(--ease)}
.vbars{display:flex;align-items:flex-end;justify-content:space-between;gap:8px;height:110px;margin-top:12px}
.vbars div{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end}
.vbars span{width:100%;max-width:26px;border-radius:8px;background:var(--fill-2);height:0;transition:height 1s var(--ease)}
.vbars span.hi{background:var(--blue)}
.vbars small{font-size:11.5px;color:var(--muted);font-weight:600}
.wbars{display:flex;align-items:flex-end;justify-content:space-between;height:50px;margin-top:12px;gap:6px}
.wbars span{flex:1;max-width:7px;border-radius:99px;background:var(--fill-2);height:0;min-height:4px;transition:height 1s var(--ease)}
.wbars span.hi{background:var(--blue)}
.nbars{margin-top:18px;display:flex;flex-direction:column;gap:7px}
.nbars span{display:block;height:6px;border-radius:99px;width:0;transition:width 1s var(--ease)}
.chart{display:flex;align-items:flex-end;gap:10px;height:170px}
.mcol{flex:1;display:flex;align-items:flex-end;justify-content:center;gap:3px;height:100%;cursor:pointer}
.mcol span{width:36%;max-width:14px;border-radius:99px;height:0;transition:height 1s var(--ease)}
.mlbl{display:flex;gap:10px;margin-top:8px}
.mlbl small{flex:1;text-align:center;font-size:11.5px;color:var(--muted);font-weight:600}
.mlbl small.cur{color:var(--ink)}
.legend{display:flex;gap:16px;font-size:12.5px;color:var(--ink-2);margin-top:12px;justify-content:center}
.legend i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px}
.seg2{display:flex;background:var(--fill);padding:3px;border-radius:99px;gap:2px}
.seg2 button{border:0;background:transparent;border-radius:99px;padding:5px 11px;font-size:12px;font-weight:600;cursor:pointer;color:var(--ink-2)}
.seg2 button.on{background:var(--fill-2);color:var(--ink)}
.mrow{display:flex;align-items:center;gap:10px;padding:12px 0;font-variant-numeric:tabular-nums;cursor:pointer}
.mrow+.mrow{border-top:1px solid var(--line)}
.mrow .m{flex:1;font-weight:600}
.wrapcard{background:linear-gradient(135deg,#4c7dff,#7c4dff 60%,#c04dff);color:#fff;border-radius:22px;padding:18px;margin-bottom:12px;cursor:pointer;display:flex;align-items:center;gap:12px}
.wrapcard b{font-size:16px;display:block}
.wrapcard small{opacity:.85}

/* hojas */
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.55);opacity:0;pointer-events:none;transition:opacity .3s;z-index:60;touch-action:none}
.sheet-bg.show{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:50%;bottom:0;transform:translate(-50%,105%);width:100%;max-width:520px;max-height:92vh;overflow:auto;padding:8px 20px calc(22px + env(safe-area-inset-bottom));z-index:70;border-radius:26px 26px 0 0;background:var(--sheet);color:var(--ink);transition:transform .42s var(--ease),opacity .3s;overscroll-behavior:contain}
.sheet.show{transform:translate(-50%,0)}
.sheet:not(.show){pointer-events:none;visibility:hidden;transition:transform .3s,opacity .3s,visibility 0s .3s}
@media (min-width:700px){.sheet{bottom:50%;border-radius:26px;transform:translate(-50%,60%) scale(.96);opacity:0}.sheet.show{transform:translate(-50%,50%) scale(1);opacity:1}}
.grab-zone{touch-action:none;padding:6px 0 14px;margin:-8px -20px 0;cursor:grab}
.grab{width:38px;height:5px;border-radius:9px;background:var(--fill-2);margin:4px auto 0}
.sheet h2{margin:0 0 16px;font-size:18px;font-weight:700;text-align:center;letter-spacing:-.02em;touch-action:none}
.seg{display:flex;background:var(--fill);border-radius:12px;padding:3px;margin-bottom:14px;gap:2px}
.seg button{flex:1;border:0;background:transparent;border-radius:10px;padding:9px;font-weight:600;cursor:pointer;color:var(--ink-2);white-space:nowrap;transition:background .2s,color .2s}
.seg button.on{background:var(--fill-2);color:var(--ink)}
.amount{display:flex;align-items:center;justify-content:center;gap:2px;position:relative;margin-top:4px}
.amount span{font-size:30px;font-weight:700;color:var(--muted)}
.amount input{background:transparent;border:0;outline:0;padding:0;margin:0;font-size:44px;font-weight:800;width:40px;min-width:30px;max-width:78vw;text-align:left;letter-spacing:-.04em;-webkit-appearance:none;appearance:none;color:var(--ink);border-radius:0;caret-color:var(--accent)}
.amount .mirror{position:absolute;visibility:hidden;white-space:pre;font-size:44px;font-weight:800;letter-spacing:-.04em;left:-9999px;top:0}
.calc{display:flex;justify-content:center;gap:8px;margin:6px 0 2px}
.calc button{width:38px;height:30px;border-radius:99px;border:0;background:var(--fill);color:var(--ink-2);font-weight:700;font-size:16px;cursor:pointer}
.calc button:active{background:var(--fill-2)}
.res{text-align:center;color:var(--ink-2);font-size:13px;min-height:18px;margin-bottom:10px;font-weight:600}
.lbl2{font-size:12.5px;color:var(--ink-2);font-weight:600;margin:4px 0 8px}
.grid-cats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:14px}
.cchip{border:1.5px solid transparent;background:var(--fill);border-radius:16px;padding:10px 4px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:11.5px;font-weight:600;color:var(--ink-2);transition:transform .18s var(--ease),border-color .2s,color .2s;text-align:center;line-height:1.2}
.cchip .ico{width:32px;height:32px}.cchip .ico svg{width:16px;height:16px}
.cchip.on{border-color:var(--ink);color:var(--ink)}
.cchip:active{transform:scale(.94)}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:12px;font-size:12.5px;color:var(--ink-2);font-weight:600}
.field input,.field textarea{font-size:16px;min-width:0;display:block;-webkit-appearance:none;appearance:none;min-height:46px;background:var(--fill);border:1.5px solid transparent;border-radius:12px;padding:11px 13px;outline:0;width:100%;color:var(--ink);font-weight:500}
body:not(.light) .field input{color-scheme:dark}
.field input:focus,.field textarea:focus{border-color:var(--fill-2)}
.field input::placeholder{color:var(--muted)}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.two>*{min-width:0}
input[type=date]{text-align:left}
input[type=date]::-webkit-date-and-time-value{text-align:left}
.btn{width:100%;border:0;border-radius:99px;padding:15px;font-weight:700;font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;transition:transform .15s var(--ease);background:var(--pri);color:var(--pri-ink);margin-top:6px}
.btn:active{transform:scale(.97)}
.btn.sec{background:var(--fill-2);color:var(--ink)}
.btn.dng{background:transparent;color:var(--red);padding:12px}
.btn.lnk{background:transparent;color:var(--ink-2);padding:10px;font-weight:600;font-size:14px}
.btn svg{width:18px;height:18px}
.two .btn{margin-top:0}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--fill);border-radius:14px;padding:12px 14px;margin-bottom:10px;font-weight:600}
.toggle small{display:block;font-weight:500;color:var(--ink-2);font-size:12px}
.sw{position:relative;width:51px;height:31px;border-radius:99px;background:var(--fill-2);border:0;cursor:pointer;transition:background .25s;flex:none}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 2px 4px rgba(0,0,0,.3);transition:left .25s var(--ease)}
.sw.on{background:var(--accent)} .sw.on::after{left:22px}
.box{display:none}.box.show{display:block;animation:up .3s both}
.freq{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
.freq button{border:1.5px solid transparent;background:var(--fill);border-radius:12px;padding:10px 6px;font-weight:600;font-size:13.5px;color:var(--ink-2);cursor:pointer}
.freq button.on{border-color:var(--ink);color:var(--ink)}
.note{font-size:12.5px;color:var(--ink-2);margin:-2px 0 10px;font-weight:500}
.swatches{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.swatches button{width:28px;height:28px;border-radius:50%;border:0;cursor:pointer;transition:transform .15s}
.swatches button.on{box-shadow:0 0 0 2px var(--sheet),0 0 0 4px var(--ink);transform:scale(1.05)}
.icons{display:grid;grid-template-columns:repeat(8,1fr);gap:6px;margin-bottom:12px}
.icons button{aspect-ratio:1;border-radius:11px;border:1.5px solid transparent;background:var(--fill);cursor:pointer;display:grid;place-items:center;color:var(--ink-2)}
.icons button.on{border-color:var(--ink);color:var(--ink)}
.list .row{padding:13px 0}
.list .rt{color:var(--ink-2);font-size:14px;display:flex;align-items:center;gap:4px}
.grp{background:var(--fill);border-radius:16px;padding:0 14px;margin-bottom:14px}
.grp .row+.row::before{left:0}
.ghead{font-size:12.5px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.05em;margin:16px 4px 6px}
.qchips{display:flex;gap:6px;overflow-x:auto;margin:0 -20px 12px;padding:0 20px;scrollbar-width:none}
.qchips::-webkit-scrollbar{display:none}
.big-c{text-align:center;font-size:36px;font-weight:700;letter-spacing:-.03em;margin:6px 0 2px;font-variant-numeric:tabular-nums}
.sub-c{text-align:center;color:var(--ink-2);margin:0 0 14px;font-size:14px}

/* toast */
.toast{position:fixed;top:calc(10px + env(safe-area-inset-top));left:50%;transform:translate(-50%,-100px);color:#000;font-weight:600;font-size:14px;padding:8px 8px 8px 16px;border-radius:99px;z-index:90;transition:transform .45s var(--ease);display:flex;align-items:center;gap:10px;background:#fff;box-shadow:0 10px 30px rgba(0,0,0,.35);white-space:nowrap;max-width:92vw}
.toast.show{transform:translate(-50%,0)}
.toast.plain{padding-right:16px}
.toast button{border:0;background:#000;color:#fff;font-weight:700;border-radius:99px;padding:6px 12px;cursor:pointer;font-size:13px}
.pop{position:fixed;z-index:95;pointer-events:none;border-radius:50%;background:var(--accent);animation:popup 1.6s var(--ease) forwards}
.pop:nth-child(3n){background:#fff}.pop:nth-child(3n+1){background:var(--blue)}
@keyframes popup{to{transform:translateY(-60vh) scale(.4);opacity:0}}

/* bloqueo */
.lock{position:fixed;inset:0;z-index:100;background:radial-gradient(120% 60% at 50% 0%,#2433ff 0%,#10128a 50%,#05061a 100%);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:20px}
.lock img{width:64px;height:64px;border-radius:16px}
.lock p{margin:6px 0 0;font-weight:600}
.pins{display:flex;gap:16px;margin:10px 0 22px}
.pins i{width:13px;height:13px;border-radius:50%;border:1.5px solid rgba(255,255,255,.7);transition:background .15s}
.pins i.on{background:#fff}
.pins.err{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-9px)}40%,80%{transform:translateX(9px)}}
.keys{display:grid;grid-template-columns:repeat(3,76px);gap:14px}
.keys button{width:76px;height:76px;border-radius:50%;border:0;background:rgba(255,255,255,.12);color:#fff;font-size:28px;font-weight:500;cursor:pointer;transition:background .15s}
.keys button:active{background:rgba(255,255,255,.28)}
.keys button.t{background:transparent;font-size:15px;font-weight:600}
.sheet .keys button{background:var(--fill);color:var(--ink)}
.sheet .pins i{border-color:var(--ink-2)}
.sheet .pins i.on{background:var(--ink)}
.sheet .keys{margin:0 auto}

/* ================= estilo Frutiger Aero ================= */
.bgs>div{position:absolute;inset:0;opacity:0;transition:opacity .7s var(--ease)}
.bgs>div.on{opacity:1}
.bg-aero{background:linear-gradient(180deg,#2fa8ec 0%,#6cc8f5 26%,#bfe8fb 52%,#e8f8ff 70%,#d9f3c8 86%,#9fd86b 100%);overflow:hidden}
.bg-aero .sun{position:absolute;width:520px;height:520px;left:-150px;top:-190px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.95) 0%,rgba(255,255,240,.5) 25%,rgba(255,255,255,0) 65%)}
.bg-aero .rays{position:absolute;left:-220px;top:-220px;width:900px;height:900px;background:repeating-conic-gradient(from 0deg at 30% 30%,rgba(255,255,255,.16) 0deg 6deg,transparent 6deg 18deg);-webkit-mask:radial-gradient(circle at 30% 30%,#000 0,transparent 60%);mask:radial-gradient(circle at 30% 30%,#000 0,transparent 60%);animation:aspin 90s linear infinite}
@keyframes aspin{to{transform:rotate(360deg)}}
.bg-aero .cl{position:absolute;background:#fff;border-radius:99px;opacity:.75;filter:blur(2px)}
.bg-aero .cl::before,.bg-aero .cl::after{content:"";position:absolute;background:#fff;border-radius:50%}
.bg-aero .c1{width:200px;height:52px;top:14%;left:-260px;animation:adrift 75s linear infinite}
.bg-aero .c1::before{width:92px;height:92px;top:-46px;left:36px}.bg-aero .c1::after{width:64px;height:64px;top:-28px;left:110px}
.bg-aero .c2{width:150px;height:40px;top:36%;left:-200px;opacity:.55;animation:adrift 100s linear infinite;animation-delay:-45s}
.bg-aero .c2::before{width:66px;height:66px;top:-34px;left:28px}.bg-aero .c2::after{width:46px;height:46px;top:-20px;left:80px}
@keyframes adrift{to{transform:translateX(calc(100vw + 520px))}}
.bg-aero .bub{position:absolute;bottom:-80px;border-radius:50%;background:radial-gradient(circle at 30% 28%,rgba(255,255,255,.95) 0 8%,rgba(255,255,255,.22) 22%,rgba(140,215,255,.1) 60%,rgba(255,255,255,.5) 100%);box-shadow:inset 0 0 8px rgba(255,255,255,.7);animation:arise linear infinite}
@keyframes arise{to{transform:translate3d(30px,-115vh,0)}}
.bg-aero svg{position:absolute;left:0;right:0;bottom:0;width:100%;height:24vh;min-height:130px}

body.aero{font-family:"Segoe UI","Frutiger","Open Sans",system-ui,sans-serif;letter-spacing:0;
  --bg:#bfe8fb;--card:rgba(255,255,255,.6);--fill:rgba(255,255,255,.6);--fill-2:rgba(255,255,255,.88);--line:rgba(10,80,130,.12);
  --ink:#0b3552;--ink-2:#2f5d7c;--muted:#6a8aa3;--accent:#2f9a0e;--red:#d92d2f;--coral:#ff6a3d;--amber:#c27c00;--blue:#0b8fd6;
  --sheet:#f4fbff;--tab:rgba(255,255,255,.62);--pri:#12a4e6;--pri-ink:#fff;
  --gloss:linear-gradient(180deg,rgba(255,255,255,.85),rgba(255,255,255,.15) 50%,rgba(255,255,255,0) 51%);
  --aqua:linear-gradient(180deg,#9fe3ff 0%,#24aaf0 50%,#0b86cf 51%,#36bdf6 100%);
  --lime:linear-gradient(180deg,#9ef060 0%,#4dbf1f 50%,#2f9a0e 51%,#58c82a 100%)}
body.aero::before{display:none}
/* vidrio con brillo */
body.aero .card,body.aero .tile,body.aero .grp{position:relative;border:1px solid rgba(255,255,255,.9);box-shadow:0 10px 30px -12px rgba(8,70,120,.45),inset 0 1px 0 #fff;backdrop-filter:blur(14px) saturate(1.4);-webkit-backdrop-filter:blur(14px) saturate(1.4)}
body.aero .card::after,body.aero .tile::after{content:"";position:absolute;left:1px;right:1px;top:1px;height:46%;border-radius:21px 21px 50% 50%/21px 21px 16px 16px;background:linear-gradient(180deg,rgba(255,255,255,.7),rgba(255,255,255,0));pointer-events:none}
body.aero .card>*,body.aero .tile>*{position:relative;z-index:1}
body.aero .tile{background:var(--card)}
body.aero .grp{background:rgba(255,255,255,.75);box-shadow:0 4px 14px -8px rgba(8,70,120,.35)}
/* saldo como burbuja acuosa */
body.aero .hero{position:relative;overflow:hidden;color:#fff;border-radius:28px;padding:24px 18px;margin:8px 0 14px;border:1px solid rgba(255,255,255,.85);
  background:linear-gradient(160deg,#5fd3ff 0%,#119fe2 45%,#0a7cc4 72%,#20b7a8 100%);box-shadow:0 22px 44px -18px rgba(6,90,150,.75),inset 0 1px 0 rgba(255,255,255,.9),inset 0 -10px 30px rgba(0,60,110,.25)}
body.aero .hero::before{content:"";position:absolute;left:-10%;right:-10%;top:-62%;height:110%;border-radius:50%;background:linear-gradient(180deg,rgba(255,255,255,.55),rgba(255,255,255,.05));pointer-events:none}
body.aero .hero>*{position:relative}
body.aero .hero .lbl{color:#fff;text-shadow:0 1px 2px rgba(0,50,90,.35);font-weight:600}
body.aero .hero .big{text-shadow:0 2px 6px rgba(0,50,90,.35)}
body.aero .hero .pill{background:rgba(255,255,255,.25);border:1px solid rgba(255,255,255,.55);color:#fff}
body.aero .ring{border-radius:50%;background:radial-gradient(circle at 50% 30%,rgba(255,255,255,.85),rgba(255,255,255,.45) 60%,rgba(255,255,255,.3));box-shadow:0 18px 40px -16px rgba(8,70,120,.5),inset 0 1px 0 #fff;border:1px solid rgba(255,255,255,.9)}
body.aero .ring .fg{stroke:#12a4e6}
body.aero .ptitle,body.aero .sec{text-shadow:0 1px 0 rgba(255,255,255,.8),0 0 14px rgba(255,255,255,.8)}
body.aero .ptitle{color:#0b3552}
/* barra superior e inferior */
body.aero .month,body.aero .rbtn{background:linear-gradient(180deg,#fff 0%,#eef8ff 50%,#dcefff 51%,#f2faff 100%);border:1px solid #fff;box-shadow:0 4px 12px -4px rgba(8,70,120,.4)}
body.aero .avatar{box-shadow:0 4px 12px -4px rgba(8,70,120,.5)}
body.aero 
body.aero .tabbar{border:1px solid #fff;box-shadow:0 10px 30px -10px rgba(8,70,120,.5),inset 0 1px 0 #fff}
body.aero .tabbar a{color:var(--ink-2)}
body.aero .tabbar a.on{color:var(--ink)}
body.aero .tabbar a.on .tic{background:var(--aqua);color:#fff;box-shadow:0 4px 12px rgba(10,130,200,.45),inset 0 1px 0 rgba(255,255,255,.9)}
body.aero .tab-add{background:radial-gradient(circle at 50% 115%,rgba(160,255,120,.9),transparent 55%),linear-gradient(180deg,#6fd9ff 0%,#119fe2 55%,#0a7cc4 100%);border:1px solid #fff;box-shadow:0 8px 20px -6px rgba(6,90,150,.8);position:relative;overflow:hidden}
body.aero .tab-add::before{content:"";position:absolute;left:7px;right:7px;top:2px;height:46%;border-radius:50%;background:linear-gradient(rgba(255,255,255,.9),rgba(255,255,255,0))}
/* esferas de categoría */
body.aero .ico{position:relative;color:#fff;border:1px solid rgba(255,255,255,.85);background:radial-gradient(circle at 50% 120%,rgba(255,255,255,.55),transparent 55%),var(--c);box-shadow:0 4px 10px -3px var(--c),inset 0 -3px 6px rgba(0,0,0,.18)}
body.aero .ico::after{content:"";position:absolute;left:5px;right:5px;top:2px;height:46%;border-radius:50%;background:linear-gradient(rgba(255,255,255,.85),rgba(255,255,255,0))}
body.aero .ico svg,body.aero .ico .ini{position:relative;z-index:1;filter:drop-shadow(0 1px 1px rgba(0,0,0,.25))}
body.aero .addrow .ico{--c:#9fb6c8}
/* botones con gel */
body.aero .btn{background:var(--aqua);color:#fff;text-shadow:0 1px 1px rgba(0,0,0,.25);border:1px solid #fff;box-shadow:0 10px 22px -10px rgba(10,110,180,.9);position:relative;overflow:hidden}
body.aero .btn::before{content:"";position:absolute;left:4px;right:4px;top:2px;height:46%;border-radius:99px 99px 40% 40%/99px 99px 10px 10px;background:linear-gradient(180deg,rgba(255,255,255,.8),rgba(255,255,255,.1));pointer-events:none}
body.aero .btn.sec{background:linear-gradient(180deg,#fff 0%,#eef8ff 50%,#dcefff 51%,#f2faff 100%);color:var(--ink);text-shadow:none;box-shadow:0 4px 12px -6px rgba(8,70,120,.4)}
body.aero .btn.dng,body.aero .btn.lnk{background:transparent;border:0;box-shadow:none;text-shadow:none}
body.aero .btn.dng::before,body.aero .btn.lnk::before{display:none}
body.aero .btn.dng{color:var(--red)} body.aero .btn.lnk{color:var(--ink-2)}
body.aero .chip{background:rgba(255,255,255,.75);color:var(--ink-2);box-shadow:0 2px 6px -3px rgba(8,70,120,.35)}
body.aero .chip.on{background:var(--aqua);color:#fff;text-shadow:0 1px 1px rgba(0,0,0,.2)}
body.aero .seg,body.aero .seg2{background:rgba(10,80,130,.08)}
body.aero .seg button.on,body.aero .seg2 button.on{background:linear-gradient(180deg,#fff,#e6f4ff);color:var(--ink);box-shadow:0 2px 6px -2px rgba(8,70,120,.4)}
body.aero .sw{background:#cbd9e4;box-shadow:inset 0 1px 3px rgba(0,0,0,.2)} body.aero .sw.on{background:var(--lime)}
body.aero .cchip,body.aero .freq button,body.aero .icons button{background:rgba(255,255,255,.8);box-shadow:0 2px 6px -2px rgba(8,70,120,.3)}
body.aero .cchip.on,body.aero .freq button.on,body.aero .icons button.on{border-color:#12a4e6;color:var(--ink);background:#fff}
body.aero .field input,body.aero .field textarea{background:#fff;border:1px solid #cfe3f2;box-shadow:inset 0 1px 3px rgba(8,70,120,.12)}
body.aero .search{background:rgba(255,255,255,.8);border:1px solid #fff}
body.aero .toggle{background:rgba(255,255,255,.8);box-shadow:0 2px 6px -2px rgba(8,70,120,.25)}
body.aero .calc button{background:rgba(255,255,255,.8);color:var(--ink-2)}
body.aero .sheet{background:linear-gradient(180deg,rgba(255,255,255,.97),rgba(232,247,255,.97));border:1px solid #fff}
body.aero .bar,body.aero .wbars span,body.aero .vbars span{background:rgba(10,80,130,.12)}
body.aero .bar span{background:linear-gradient(180deg,rgba(255,255,255,.6) 0%,rgba(255,255,255,0) 50%),var(--c,var(--accent))}
body.aero .vbars span.hi,body.aero .wbars span.hi{background:var(--aqua)}
body.aero .mcol span{border:1px solid rgba(255,255,255,.8)}
body.aero .wrapcard{background:linear-gradient(160deg,#b8f06a 0%,#5cc62e 45%,#18a99a 100%);border:1px solid #fff;box-shadow:0 14px 30px -14px rgba(40,120,20,.7)}
body.aero .dayh{text-shadow:0 0 12px rgba(255,255,255,.9)}
body.aero .lock{background:linear-gradient(180deg,#2fa8ec 0%,#6cc8f5 40%,#bfe8fb 75%,#9fd86b 100%)}
body.aero .lock p,body.aero .lock .btn.lnk{color:#0b3552!important}
body.aero .lock .keys button{background:linear-gradient(180deg,#fff 0%,#eef8ff 50%,#dcefff 51%,#f2faff 100%);color:#0b3552;border:1px solid #fff;box-shadow:0 6px 14px -6px rgba(8,70,120,.5)}
body.aero .lock .pins i{border-color:#0b3552} body.aero .lock .pins i.on{background:#0b3552}
body.aero .toast{background:linear-gradient(180deg,#fff 0%,#f0faff 50%,#e0f3ff 51%,#f6fcff 100%);border:1px solid #fff}
.stylepick{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:12px 0}
.stylepick button{border:2px solid transparent;border-radius:16px;padding:0;overflow:hidden;cursor:pointer;background:none;color:var(--ink);font-weight:600;font-size:12.5px}
.stylepick button i{display:block;height:64px;border-radius:12px;margin-bottom:6px}
.stylepick button.on{border-color:var(--blue)}
.stylepick .s-dark{background:radial-gradient(120% 80% at 50% 0%,#2433ff,#070833 80%)}
.stylepick .s-light{background:radial-gradient(120% 80% at 50% 0%,#b9c2ff,#eef0f7 80%);border:1px solid rgba(0,0,0,.08)}
.stylepick .s-aero{background:linear-gradient(180deg,#2fa8ec,#bfe8fb 60%,#9fd86b)}
.mcol span.z{visibility:hidden}.vbars span.z{opacity:.5}

/* ================= animaciones (sutiles) ================= */
:root{--spring:cubic-bezier(.3,1.15,.5,1);--out:cubic-bezier(.22,1,.36,1)}
.tabbar .tic{background:transparent!important;box-shadow:none!important}
.tab-ind{position:absolute;left:0;top:10px;height:30px;border-radius:99px;background:var(--fill-2);z-index:-1;pointer-events:none;
  transition:transform .38s var(--out),width .38s var(--out)}
body.aero .tab-ind{background:var(--aqua);box-shadow:0 4px 12px rgba(10,130,200,.4),inset 0 1px 0 rgba(255,255,255,.9)}
body.aero .tabbar a.on .tic{color:#fff}
.tabbar a .tic svg{transition:transform .2s var(--out)}
.tabbar a:active .tic svg{transform:scale(.9)}
.tabbar a.tbump .tic svg{animation:tpop .35s var(--out)}
@keyframes tpop{from{transform:scale(.88)}to{transform:none}}
.tab-add{transition:transform .2s var(--out)}
.tab-add:active{transform:scale(.92)}
/* transición entre pestañas y meses */
#view.go-l{animation:vin-l .32s var(--out) both}
#view.go-r{animation:vin-r .32s var(--out) both}
@keyframes vin-l{from{opacity:0;transform:translateX(12px)}}
@keyframes vin-r{from{opacity:0;transform:translateX(-12px)}}
.anim{animation:up .45s var(--out) both}
@keyframes up{from{opacity:0;transform:translateY(8px)}}
/* respuesta al tocar */
.row,.card[data-act],.tile,.chip,.cchip,.btn,.rbtn,.avatar,.month button,.pill,.qa,.freq button,.seg button{transition:transform .18s var(--out),opacity .18s,background .25s,color .25s,border-color .25s}
.row:active{opacity:.7}
.card[data-act]:active,.wrapcard:active{transform:scale(.985)}
.chip:active,.cchip:active,.btn:active{transform:scale(.97)}
.rbtn:active,.avatar:active{transform:scale(.94)}
#mLbl{display:inline-block}

/* ================= fijos (se repiten solos) ================= */
const FREQS=[['monthly','Cada mes'],['semimonthly','Quincenal'],['biweekly','Cada 2 semanas'],['weekly','Cada semana']];
function occurrences(r,from,to){const out=[];if(!r.start||!r.freq)return out;if(from<r.start)from=r.start;if(from>to)return out;
  if(r.freq==='weekly'||r.freq==='biweekly'){const step=r.freq==='weekly'?7:14;const d=pD(r.start);const diff=Math.round((pD(from)-d)/864e5);if(diff>0)d.setDate(d.getDate()+Math.floor(diff/step)*step);

function wire(v){
  $$('[data-mov]',v).forEach(b=>b.onclick=()=>{if(b._swiped)return;movSheet(items(b.dataset.k).find(i=>i.id===b.dataset.mov))});
  $$('[data-con]',v).forEach(b=>b.onclick=()=>{if(b._swiped)return;conSheet(b.dataset.con)});
  $$('[data-rec]',v).forEach(b=>b.onclick=()=>{const r=S.config.recurring.find(x=>x.id===b.dataset.rec);if(r.kind==='ahorro')goalSheet(S.config.goals.find(g=>g.id===r.goalId));else recSheet(r)});
  $$('[data-acc]',v).forEach(b=>b.onclick=()=>accSheet(accs().find(a=>a.id===b.dataset.acc)));
  $$('[data-go]',v).forEach(b=>b.onclick=()=>location.hash=b.dataset.go);
  $$('[data-act]',v).forEach(b=>b.onclick=()=>{const a=b.dataset.act;if(a==='backup')downloadBackup();else if(a==='wrap')wrapSheet();else if(a==='rep')location.hash='reportes'});
  $$('[data-goal]',v).forEach(b=>b.onclick=()=>goalDetail(b.dataset.goal));
  $$('[data-newgoal]',v).forEach(b=>b.onclick=()=>goalSheet(null));
  $$('[data-addnow]',v).forEach(b=>b.onclick=()=>movSheet(null,'egreso'));
  $$('[data-cat]',v).forEach(b=>b.onclick=()=>catSheet(cats().find(c=>c.id===b.dataset.cat)));
  $$('[data-range]',v).forEach(b=>b.onclick=()=>{rangeN=+b.dataset.range;render(true)});
  $$('[data-month]',v).forEach(b=>b.onclick=()=>{cur=b.dataset.month;location.hash='movimientos'});
  const q=$('#q',v);if(q){q.oninput=()=>{filt.q=q.value;$('#mlist').innerHTML=movList();wire($('#mlist'));swipeRows($('#mlist'))};
    $('#fBtn').onclick=()=>{showFilt=!showFilt;$('#fBox').classList.toggle('hidden',!showFilt);$('#fBtn').classList.toggle('on',showFilt||filt.type!=='all'||!!filt.cat)};
    $$('[data-ft]',v).forEach(b=>b.onclick=()=>{filt.type=b.dataset.ft;render(false)});$$('[data-fc]',v).forEach(b=>b.onclick=()=>{filt.cat=b.dataset.fc;render(false)})}
  swipeRows(v);
}
function swipeRows(root){$$('.swr',root).forEach(w=>{const row=$('.row',w),del=$('.del',w);let x0=null,y0=0,dx=0,open=false,horiz=null;
  row.addEventListener('touchstart',e=>{x0=e.touches[0].clientX;y0=e.touches[0].clientY;horiz=null;row.style.transition='none';row._swiped=false},{passive:true});
  row.addEventListener('touchmove',e=>{if(x0==null)return;const mx=e.touches[0].clientX-x0,my=e.touches[0].clientY-y0;if(horiz===null&&(Math.abs(mx)>8||Math.abs(my)>8))horiz=Math.abs(mx)>Math.abs(my);
    if(!horiz)return;e.preventDefault();w.classList.add('swiping');dx=Math.min(0,Math.max(-120,(open?-92:0)+mx));row.style.transform=`translateX(${dx}px)`;row._swiped=true},{passive:false});
  row.addEventListener('touchend',()=>{row.style.transition='';if(horiz){open=dx<-44;row.style.transform=open?'translateX(-92px)':'';if(!open)setTimeout(()=>{if(!open)w.classList.remove('swiping')},260);setTimeout(()=>row._swiped=false,50)}x0=null});
  del.onclick=()=>{const id=del.dataset.del,k=del.dataset.k;
    if(del.dataset.contrib){const c=S.savings.contribs.find(x=>x.id===id);S.savings.contribs=S.savings.contribs.filter(x=>x.id!==id);persist();render(false);toast('Eliminado','Deshacer',()=>{S.savings.contribs.push(c);persist();render(false)})}
    else{const it=items(k).find(x=>x.id===id);S.months[k]=items(k).filter(x=>x.id!==id);persist();render(false);toast('Eliminado','Deshacer',()=>{S.months[k]=[...items(k),it];persist();render(false)})}}})}

/* ================= hojas ================= */
function openSheet(html){const s=$('#sheet');s.style.transform='';s.style.transition='';s.scrollTop=0;s.innerHTML='<div class="grab-zone"><div class="grab"></div></div>'+html;s.classList.add('show');$('#sheetBg').classList.add('show')}
function closeSheet(){$('#sheet').classList.remove('show');$('#sheetBg').classList.remove('show')}
$('#sheetBg').onclick=closeSheet;addEventListener('keydown',e=>{if(e.key==='Escape')closeSheet()});
(()=>{const sh=$('#sheet');let sy=null,dy=0,drag=false;const wide=()=>matchMedia('(min-width:700px)').matches;const pos=d=>wide()?`translate(-50%,calc(50% + ${d}px)) scale(1)`:`translate(-50%,${d}px)`;
  sh.addEventListener('touchstart',e=>{sy=e.touches[0].clientY;dy=0;drag=false},{passive:true});
  sh.addEventListener('touchmove',e=>{if(sy==null)return;const d=e.touches[0].clientY-sy;const h=e.target.closest('.grab-zone,h2');
    if(h||(sh.scrollTop<=0&&d>0&&!e.target.closest('input,textarea,.qchips,.chips'))){e.preventDefault();if(d>0){drag=true;dy=d;sh.style.transition='none';sh.style.transform=pos(d)}}},{passive:false});
  const end=()=>{if(!drag){sy=null;return}sh.style.transition='';if(dy>110){sh.style.transform=pos(innerHeight);$('#sheetBg').classList.remove('show');setTimeout(()=>{closeSheet();sh.style.transform=''},300)}else sh.style.transform='';sy=null;drag=false};
  sh.addEventListener('touchend',end);sh.addEventListener('touchcancel',end);$('#sheetBg').addEventListener('touchmove',e=>e.preventDefault(),{passive:false})})();
function ask(msg,ok,label='Eliminar'){openSheet(`<h2>¿Seguro?</h2><p class="sub-c">${msg}</p><button class="btn" id="okA" style="background:var(--red);color:#fff">${label}</button><button class="btn lnk" id="noA">Cancelar</button>`);$('#okA').onclick=()=>{closeSheet();ok()};$('#noA').onclick=closeSheet}
const segHTML=(opts,val)=>`<div class="seg">${opts.map(([k,l])=>`<button type="button" data-s="${k}" class="${k===val?'on':''}">${l}</button>`).join('')}</div>`;
function wireSeg(root,cb){$$('.seg button',root).forEach(b=>b.onclick=()=>{$$('.seg button',root).forEach(x=>x.classList.toggle('on',x===b));cb(b.dataset.s)})}
function catGrid(type,sel,withNew=true){return cats().filter(c=>c.type===type).map(c=>`<button type="button" class="cchip ${c.id===sel?'on':''}" data-c="${c.id}">${icoC(c)}${esc(c.name)}</button>`).join('')+(withNew?`<button type="button" class="cchip" data-c="__new">${icoC({color:'#94a3b8',icon:'plus'})}Nueva</button>`:'')}
function accChips(sel){return accs().length>1?`<div class="lbl2">Cuenta</div><div class="chips" style="margin:0 -20px 12px;padding:0 20px">${accs().map(a=>`<button type="button" class="chip ${a.id===sel?'on':''}" data-a="${a.id}">${esc(a.name)}</button>`).join('')}</div>`:''}
function freqFields(f,d1,d2){return `<div class="freq">${FREQS.map(([k,l])=>`<button type="button" data-f="${k}" class="${k===f?'on':''}">${l}</button>`).join('')}</div>
  <div class="two" data-days style="display:none"><label class="field">Primer día<input data-d1 type="text" inputmode="numeric" value="${d1||15}"></label><label class="field">Segundo día<input data-d2 type="text" inputmode="numeric" value="${d2||30}"></label></div><p class="note" data-note></p>`}
function wireFreq(box,freq,getStart){let f=freq;const d=()=>({d1:Math.min(31,Math.max(1,parseInt($('[data-d1]',box).value)||15)),d2:Math.min(31,Math.max(1,parseInt($('[data-d2]',box).value)||30))});
  const refresh=()=>{$('[data-days]',box).style.display=f==='semimonthly'?'grid':'none';const st=getStart()||today();const r={freq:f,start:st,day1:f==='semimonthly'?d().d1:+st.slice(8),day2:d().d2};
    $('[data-note]',box).textContent=`${freqText(r)}. Próximas: ${occurrences(r,st,addDays(st,400)).slice(0,3).map(shortDate).join(', ')}`};
  $$('[data-f]',box).forEach(b=>b.onclick=()=>{f=b.dataset.f;$$('[data-f]',box).forEach(x=>x.classList.toggle('on',x===b));refresh()});$$('[data-d1],[data-d2]',box).forEach(i=>i.oninput=refresh);refresh();
  return{refresh,get:()=>{const st=getStart()||today();return f==='semimonthly'?{freq:f,day1:d().d1,day2:d().d2}:f==='monthly'?{freq:f,day1:+st.slice(8)}:{freq:f}}}}

async function shareOrDownload(text,name,type){try{const f=new File([text],name,{type});if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f],title:name});return true}}catch(e){if(e&&e.name==='AbortError')return false}
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;document.body.appendChild(a);a.click();a.remove();return true}

  const ok=await shareOrDownload('﻿'+rows.map(r=>r.map(q).join(',')).join('\n'),`namufin-${today()}.csv`,'text/csv');if(ok)toast('Archivo para Excel listo')}
function backupSheet(){const bk=lastBackupDays();openSheet(`<h2>Respaldo y exportar</h2><p class="sub-c" style="font-size:13px">${bk===null?'Aún no has descargado un respaldo.':bk<1?'Respaldaste hoy.':'Último respaldo hace '+bk+' día'+(bk>1?'s':'')+'.'} Guárdalo en Archivos o iCloud.</p>
  <button class="btn" id="bD">${ic('save')}Descargar respaldo</button><button class="btn sec" id="bC">${ic('file')}Exportar a Excel (CSV)</button><button class="btn sec" id="bR">${ic('back')}Restaurar respaldo</button><button class="btn lnk" id="bX">Volver</button>`);
  $('#bD').onclick=downloadBackup;$('#bC').onclick=exportCSV;$('#bR').onclick=restoreSheet;$('#bX').onclick=settingsSheet}
function restoreSheet(){openSheet(`<h2>Restaurar</h2><p class="sub-c" style="font-size:13px">Elige tu archivo de respaldo. Reemplaza los datos actuales.</p>
  <label class="btn" style="cursor:pointer">${ic('file')}Elegir archivo<input type="file" id="rF" accept=".json,application/json,text/plain" hidden></label>
  <label class="field" style="margin-top:12px">O pega el texto<textarea id="rT" style="height:110px;font-size:12px"></textarea></label><button class="btn sec" id="rOk">Restaurar texto</button><button class="btn lnk" id="rB">Volver</button>`);
  const doIt=t=>{try{const o=JSON.parse(t);if(!o.config||!o.months)throw 0;S.config=o.config;S.savings=o.savings||{contribs:[]};S.months=o.months;persist();load();applyRecurring();closeSheet();render(true);toast('Respaldo restaurado')}catch(e){toast('Ese archivo no es un respaldo válido')}};
  $('#rF').onchange=async e=>{const f=e.target.files[0];if(f)doIt(await f.text())};$('#rOk').onclick=()=>doIt($('#rT').value);$('#rB').onclick=backupSheet}

/* ---------- código de bloqueo ---------- */
async function hashPin(p){try{const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode('namufin:'+p));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}catch(e){return 'p'+p.split('').reverse().join('')}}
function keypad(onDigit,onDel,extra){return `<div class="pins" id="pins"><i></i><i></i><i></i><i></i></div><div class="keys">${[1,2,3,4,5,6,7,8,9].map(n=>`<button type="button" data-n="${n}">${n}</button>`).join('')}<button type="button" class="t" id="kx">${extra||''}</button><button type="button" data-n="0">0</button><button type="button" class="t" id="kd">${ic('left')}</button></div>`}
function wireKeypad(root,done){let v='';const dots=()=>$$('#pins i',root).forEach((d,i)=>d.classList.toggle('on',i<v.length));
  $$('[data-n]',root).forEach(b=>b.onclick=()=>{if(v.length>=4)return;v+=b.dataset.n;dots();if(v.length===4)setTimeout(()=>{done(v,()=>{v='';dots();const p=$('#pins',root);p.classList.remove('err');void p.offsetWidth;p.classList.add('err')})},120)});
  $('#kd',root).onclick=()=>{v=v.slice(0,-1);dots()}}
function pinMenu(){if(!hasPin()){pinSet();return}openSheet(`<h2>Código de bloqueo</h2><p class="sub-c">Se pide al abrir la app.</p><button class="btn sec" id="pC">Cambiar código</button><button class="btn dng" id="pO">Desactivar código</button><button class="btn lnk" id="pB">Volver</button>`);
  $('#pC').onclick=pinSet;$('#pB').onclick=settingsSheet;$('#pO').onclick=()=>{localStorage.removeItem(PINK);toast('Código desactivado');settingsSheet()}}
function pinSet(){let first=null;openSheet(`<h2 id="pT">Crea un código de 4 dígitos</h2>${keypad()}<button class="btn lnk" id="pB">Cancelar</button>`);$('#pB').onclick=settingsSheet;
  wireKeypad($('#sheet'),async(v,reset)=>{if(!first){first=v;$('#pT').textContent='Confírmalo';reset();$('#pins').classList.remove('err');return}
    if(v!==first){first=null;$('#pT').textContent='No coincide, intenta de nuevo';reset();return}localStorage.setItem(PINK,await hashPin(v));toast('Código activado');settingsSheet()})}
let lockedAt=0;
function showLock(){if(!hasPin())return;const L=$('#lock');L.innerHTML=`<img src="${$('#btnSet img').getAttribute('src')}" alt=""><p>Ingresa tu código</p>${keypad(0,0,'')}<button class="btn lnk" id="kf" style="color:rgba(255,255,255,.7);width:auto">¿Olvidaste tu código?</button>`;L.classList.remove('hidden');
  wireKeypad(L,async(v,reset)=>{if(await hashPin(v)===localStorage.getItem(PINK)){L.classList.add('hidden');L.innerHTML=''}else reset()});
  $('#kf').onclick=()=>{L.innerHTML=`<img src="icon-180.png" alt=""><p style="text-align:center;max-width:300px">Por seguridad, la única forma de quitar el código es borrar los datos de este teléfono. Si tienes respaldo, después lo puedes restaurar.</p>
    <button class="btn" id="kw" style="max-width:300px;background:#ff5a4e;color:#fff">Borrar datos y quitar código</button><button class="btn lnk" id="kb" style="color:#fff;width:auto">Volver</button>`;
    $('#kb').onclick=showLock;$('#kw').onclick=()=>{localStorage.removeItem(LS);localStorage.removeItem(PINK);location.reload()}}}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden')lockedAt=Date.now();else{if(hasPin()&&lockedAt&&Date.now()-lockedAt>60000)showLock();const n=applyRecurring();if(n){render(false);toast(`Se registraron ${n} movimiento${n>1?'s':''} fijo${n>1?'s':''}`)}}});

/* ---------- resumen del mes ---------- */
function wrapSheet(){const k=addM(mKey(today()),-1),t=totals(k),pt=totals(addM(k,-1));prefs.wrapSeen=k;savePrefs();
  const top=Object.entries(t.by).filter(([id])=>id!=='__ahorro').sort((a,b)=>b[1]-a[1])[0];
  const byDay={};items(k).forEach(i=>{if(i.type==='egreso')byDay[i.date]=(byDay[i.date]||0)+i.amount});const bd=Object.entries(byDay).sort((a,b)=>b[1]-a[1])[0];
  const n=monthList(k).length,diff=t.gastos-pt.gastos;
  const card=(a,b,c)=>`<div class="tile" style="background:var(--fill)"><small>${a}</small><b>${b}</b>${c?`<small>${c}</small>`:''}</div>`;
  openSheet(`<div style="display:flex;justify-content:center;margin-bottom:8px">${icoC({color:'#a78bfa',icon:'sparkle'})}</div><h2 style="margin-bottom:2px">Tu ${mName(k).toLowerCase()}</h2>
    <div class="big-c" style="color:${t.bal>=0?'var(--accent)':'var(--red)'}">${t.bal>=0?'+':'−'}${fmt(Math.abs(t.bal))}</div><p class="sub-c">${t.bal>=0?'Te quedó':'Gastaste de más'}${t.inc?' · '+pct(Math.max(t.bal,0)/t.inc)+' de tus ingresos':''}</p>
    <div class="tiles">${card('Ingresos',fmt(t.inc))}${card('Gastos',fmt(t.gastos),pt.gastos?`<span class="${diff>0?'up':'dn'}">${diff>0?'▲':'▼'} ${fmt(Math.abs(diff))} vs mes anterior</span>`:'')}
      ${card('Mayor gasto',top?esc(cat(top[0]).name):'—',top?fmt(top[1]):'')}${card('Día más caro',bd?longDate(bd[0]):'—',bd?fmt(bd[1]):'')}${card('Ahorraste',fmt(t.sav))}${card('Movimientos',n)}</div>
    <button class="btn" id="wOk">Genial</button>`);$('#wOk').onclick=()=>{closeSheet();render(false)}}

/* ================= arranque ================= */
$$('#tabs [data-ic]').forEach(a=>a.innerHTML='<span class="tic">'+ic(a.dataset.ic)+'</span><span>'+a.textContent+'</span>');
$('#mPrev').innerHTML=ic('left');$('#mNext').innerHTML=ic('right');$('#fab').innerHTML=ic('plus');
const flip=()=>{const l=$('#mLbl');l.classList.remove('flip');void l.offsetWidth;l.classList.add('flip')};
$('#mPrev').onclick=()=>{cur=addM(cur,-1);render(true);slide('r');flip()};$('#mNext').onclick=()=>{cur=addM(cur,1);render(true);slide('l');flip()};
$('#fab').onclick=()=>{movSheet(null,'egreso')};$('#btnSet').onclick=settingsSheet;
$('#btnEye').onclick=()=>{HIDE=!HIDE;prefs.hide=HIDE;savePrefs();render(false);toast(HIDE?'Montos ocultos':'Montos visibles')};
;
['gesturestart','gesturechange','gestureend'].forEach(t=>document.addEventListener(t,e=>e.preventDefault(),{passive:false}));
document.addEventListener('touchmove',e=>{if(e.touches.length>1)e.preventDefault()},{passive:false});
const isField=el=>el&&el.closest&&el.closest('input,textarea,.calc');
document.addEventListener('touchstart',ev=>{const a=document.activeElement;if(a&&/^(INPUT|TEXTAREA)$/.test(a.tagName)&&!isField(ev.target))a.blur()},{capture:true,passive:true});
$('#sheet').addEventListener('keydown',ev=>{if(ev.key==='Enter'&&ev.target.tagName==='INPUT'&&ev.target.type!=='date'){ev.preventDefault();ev.target.blur()}});
load();
document.documentElement.style.background=HTMLBG[prefs.theme]||HTMLBG.dark;themeAssets();
(()=>{const w=$('#bubs');for(let i=0;i<12;i++){const b=document.createElement('i');b.className='bub';const z=12+Math.random()*40;b.style.cssText=`width:${z}px;height:${z}px;left:${Math.random()*100}%;animation-duration:${14+Math.random()*18}s;animation-delay:${-Math.random()*30}s`;w.appendChild(b)}})();
const n0=applyRecurring();
setView(location.hash.slice(1)||'inicio');
showLock();
if(n0)setTimeout(()=>toast(`Se registraron ${n0} movimiento${n0>1?'s':''} fijo${n0>1?'s':''}`),700);
try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(e){}
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
})();
</script>
